name: Request a new benefit
description: Suggest a benefit / merchant / bank to add
labels: [enhancement, data]
body:
  - type: input
    id: bank
    attributes:
      label: Which bank / card tier offers this
      placeholder: e.g. Sparkasse Mastercard, Mastercard World Elite
    validations:
      required: true
  - type: input
    id: merchant
    attributes:
      label: Merchant
      placeholder: e.g. Decathlon Slovenija
    validations:
      required: true
  - type: input
    id: discount
    attributes:
      label: Discount
      placeholder: e.g. 15% off online purchases
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL (bank's benefits page)
      placeholder: https://www.example-bank.si/benefits/...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Discount code, expiry date, conditions, etc.
