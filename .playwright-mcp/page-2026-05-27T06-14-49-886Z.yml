                - paragraph [ref=e73]: Od očarljivih butičnih hotelov do zgodovinskih palač in ekskluzivnih otoških resortov – vsi predstavljeni hoteli ponujajo edinstveno kombinacijo razkošja, avtentičnosti in lokalnega značaja. Nahajajo se na najbolj slikovitih lokacijah – od središč zgodovinskih mest do mirnih otoških kotičkov. Gostom ponujajo brezhibno storitev, vrhunsko kulinariko, umetniško navdihnjeno okolje ter raznoliko arhitekturno in kulturno dediščino.
